<style>
/* Layout: one narrow column, sticky search + filter bar, category groups of tappable rows, bottom sheets for editing and settings */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --fg:#26302c; --muted:#6c7771; --line:#e1e5de;
  --accent:#3f7a6d; --on-accent:#ffffff; --accent-soft:#e3efe9; --warm:#b86f4c; --warm-soft:#f6e9e1; --done:#9aa39e;
  --display:'Gowun Dodum','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161b19; --surface:#1f2623; --fg:#e6ebe7; --muted:#9aa6a0; --line:#2f3834;
  --accent:#7fc0ae; --on-accent:#10201b; --accent-soft:#233a33; --warm:#e0a07f; --warm-soft:#3a2a22; --done:#66706b; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;text-wrap:balance}
.icon-btn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:7px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.sum{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:6px;font-variant-numeric:tabular-nums}
.sum b{color:var(--fg);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.hint{margin-top:12px;background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:.85rem;display:flex;gap:10px;align-items:flex-start}
.hint p{margin:0;flex:1;min-width:0}
.hint button{flex:none;border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:0 2px}
.hint .go{color:var(--accent);font-weight:600}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line);margin-top:8px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toggle{flex:none;display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.toggle input{width:auto}
section{margin-top:18px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.ch h2{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0}
.ch span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ck{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:0;color:var(--on-accent);font-size:15px;padding:0}
.ck[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.main{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;font:inherit;color:inherit;padding:0}
.nm{font-weight:500}
.row.done .nm{color:var(--done);text-decoration:line-through}
.meta{font-size:.82rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.72rem;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px;background:var(--accent-soft);color:var(--accent)}
.when{color:var(--warm)}
.tip{font-size:.8rem;color:var(--muted);margin-top:4px;background:var(--bg);border-radius:8px;padding:4px 8px}
.addrow{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:none;color:var(--accent);font:inherit;font-size:.88rem;padding:10px 12px;text-align:left;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:13px 19px;font:inherit;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.status{font-size:.85rem;color:var(--muted);text-align:center;padding:30px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0 0 12px}
.sheet h4{font-size:.9rem;margin:18px 0 6px}
.sheet p.small{font-size:.82rem;color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1;font-weight:600}
.btn.del{color:var(--warm)}
.confirm{margin-top:10px;padding:10px;border-radius:10px;background:var(--warm-soft);font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

}
let storageOk=true;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D));storageOk=true}catch(e){if(storageOk)toast('이 브라우저에서는 저장이 안 돼요. 사생활 보호 모드인지 확인해 주세요.');storageOk=false}}
function persistUI(){try{localStorage.setItem(UI_KEY,JSON.stringify(UI))}catch(e){}}
function sorted(){return D.items.slice().sort((a,b)=>(a.order||0)-(b.order||0))}
function cats(){const s=[];for(const it of sorted())if(!s.includes(it.cat))s.push(it.cat);return s}

/* "출산 8M 전" + 예정일 → 2026.02 */
function whenDate(when){
  if(!D.due||!when)return '';
  const due=new Date(D.due+'T00:00:00');if(isNaN(due))return '';
  const out=[];
  for(const part of when.split(',')){
    const p=part.trim();let off=null;
    if(p==='출산')off=0;
    else{const m=p.match(/(\d+)\s*M\s*(전|후)/);if(m)off=(m[2]==='전'?-1:1)*Number(m[1])}
    if(off==null)continue;
    const d=new Date(due.getFullYear(),due.getMonth()+off,1);
    out.push(d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return out.join(', ');
}
function priceLabel(i){return i.price!=null?won(i.price):(i.priceText||'')}

function render(){
  const all=D.items, done=all.filter(i=>i.done).length, total=all.reduce((a,i)=>a+(i.price||0),0);
  const dueTxt=D.due?`<span>예정일 <b>${D.due.replace(/-/g,'.')}</b></span>`:'';
  $('#sum').innerHTML=`<span><b>${all.length}</b>개 품목</span><span>체크 <b>${done}</b>개</span><span>금액 합계 <b>${won(total)}</b></span>${dueTxt}`;
  $('#bar').style.width=all.length?(done/all.length*100)+'%':'0';
  const cs=cats(); if(UI.cat!=='전체'&&!cs.includes(UI.cat))UI.cat='전체';
  $('#chips').innerHTML=['전체',...cs].map(c=>`<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===UI.cat}">${esc(c)}</button>`).join('');
  $('#onlyTodo').checked=UI.onlyTodo;
  const q=$('#q').value.trim().toLowerCase(), list=sorted();
  let html='';
  for(const c of cs){
    if(UI.cat!=='전체'&&c!==UI.cat)continue;
    const inCat=list.filter(i=>i.cat===c);
    const vis=inCat.filter(i=>(!UI.onlyTodo||!i.done)&&(!q||[i.name,i.brand,i.note,i.tip].join(' ').toLowerCase().includes(q)));
    if(!vis.length&&(q||UI.onlyTodo))continue;
    const sub=inCat.reduce((a,i)=>a+(i.price||0),0), cd=inCat.filter(i=>i.done).length;
    html+=`<section><div class="ch"><h2>${esc(c)}</h2><span>${cd}/${inCat.length}${sub?' · '+won(sub):''}</span></div><div class="list">`;
    for(const i of vis){
      const wd=whenDate(i.when);
      const meta=[i.brand&&esc(i.brand),priceLabel(i)&&esc(priceLabel(i)),i.qty&&esc(i.qty)+'개',i.when&&`<span class="when">${esc(i.when)}${wd?' · '+wd:''}</span>`].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
      html+=`<div class="row${i.done?' done':''}">
        <button class="ck" type="button" role="checkbox" aria-checked="${!!i.done}" aria-label="${esc(i.name)} 체크" data-ck="${i.id}">${i.done?'✓':''}</button>
        <button class="main" type="button" data-ed="${i.id}"><div class="nm">${esc(i.name)||'(이름 없음)'}${i.note?`<span class="tag">${esc(i.note)}</span>`:''}</div>${meta?`<div class="meta">${meta}</div>`:''}${i.tip?`<div class="tip">${esc(i.tip)}</div>`:''}</button></div>`;
    }
    html+=`<button class="addrow" type="button" data-add="${esc(c)}">+ ${esc(c)}에 추가</button></div></section>`;
  }
  $('#out').innerHTML=html||(all.length?'<p class="status">조건에 맞는 품목이 없어요.</p>':'<p class="status">목록이 비어 있어요. 아래 “+ 품목 추가”로 첫 품목을 넣어 보세요.</p>');
}

let toastT;
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function closeSheet(){$('#sheetHost').innerHTML=''}
function sheet(html){$('#sheetHost').innerHTML=`<div class="scrim" id="scrim">${html}</div>`;$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()})}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-cat],[data-ck],[data-ed],[data-add]');if(!t)return;
  if(t.dataset.cat!=null){UI.cat=t.dataset.cat;persistUI();render();window.scrollTo({top:0});return}
  if(t.dataset.ck){const it=D.items.find(i=>i.id===t.dataset.ck);if(it){it.done=!it.done;persist();render()}return}
  if(t.dataset.ed){editSheet(D.items.find(i=>i.id===t.dataset.ed));return}
  if(t.dataset.add!=null)editSheet(null,t.dataset.add);
});
$('#fab').onclick=()=>editSheet(null,UI.cat!=='전체'?UI.cat:(cats()[0]||''));
$('#q').addEventListener('input',render);
$('#onlyTodo').addEventListener('change',e=>{UI.onlyTodo=e.target.checked;persistUI();render()});
$('#settingsBtn').onclick=settingsSheet;

function editSheet(it,defCat){
  const isNew=!it; it=it||{cat:defCat||'',name:'',brand:'',price:null,priceText:'',qty:'',note:'',when:'',tip:'',done:false};
  const cs=cats();
  sheet(`<form class="sheet" id="sf" autocomplete="off">
    <h3>${isNew?'품목 추가':'품목 수정'}</h3>
    <div class="grid">
      <label class="f full">품목<input id="f-name" value="${esc(it.name)}" required></label>
      <label class="f">분류<select id="f-cat">${cs.map(c=>`<option ${c===it.cat?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ 새 분류…</option></select></label>
      <label class="f" id="f-newcat-w" hidden>새 분류 이름<input id="f-newcat"></label>
      <label class="f">브랜드<input id="f-brand" value="${esc(it.brand)}"></label>
      <label class="f">금액 (원)<input id="f-price" inputmode="numeric" value="${esc(it.price!=null?it.price:it.priceText)}"></label>
      <label class="f">수량<input id="f-qty" value="${esc(it.qty)}"></label>
      <label class="f">비고<input id="f-note" value="${esc(it.note)}" placeholder="선물 · 당근 · 대여"></label>
      <label class="f full">구매 시기<input id="f-when" value="${esc(it.when)}" placeholder="예: 출산 2M 전, 출산 3M 후"></label>
      <label class="f full">꿀팁 · 메모<textarea id="f-tip" rows="3">${esc(it.tip)}</textarea></label>
    </div>
    <div class="acts">
      <button class="btn" type="button" id="cancel">닫기</button>
      ${isNew?'':'<button class="btn del" type="button" id="del">삭제</button>'}
      <button class="btn pri" type="submit">저장</button>
    </div>
    <div id="cf"></div>
  </form>`);
  $('#cancel').onclick=closeSheet;
  const sel=$('#f-cat');sel.onchange=()=>{$('#f-newcat-w').hidden=sel.value!=='__new'};
  if(!cs.length){sel.value='__new';$('#f-newcat-w').hidden=false}
  if(!isNew)$('#del').onclick=()=>{
    $('#cf').innerHTML=`<div class="confirm">“${esc(it.name)}”을(를) 지울까요? <button class="btn del" type="button" id="yes">지우기</button></div>`;
    $('#yes').onclick=()=>{D.items=D.items.filter(x=>x.id!==it.id);persist();render();closeSheet();toast('지웠어요')};
  };
  $('#sf').onsubmit=e=>{
    e.preventDefault();
    let cat=sel.value==='__new'?$('#f-newcat').value.trim():sel.value; if(!cat)cat='기타';
    const raw=$('#f-price').value.trim(), digits=raw.replace(/[,원\s]/g,''), num=/^\d+$/.test(digits)?Number(digits):null;
    let order=it.order;
    if(isNew||cat!==it.cat){const inCat=D.items.filter(i=>i.cat===cat&&i.id!==it.id);order=inCat.length?Math.max(...inCat.map(i=>i.order||0))+0.5:D.items.reduce((a,i)=>Math.max(a,i.order||0),0)+10}
    const d={cat,name:$('#f-name').value.trim(),brand:$('#f-brand').value.trim(),price:num,priceText:num==null?raw:'',qty:$('#f-qty').value.trim(),note:$('#f-note').value.trim(),when:$('#f-when').value.trim(),tip:$('#f-tip').value.trim(),done:!!it.done,order};
    if(isNew)D.items.push({id:uid(),...d});else Object.assign(D.items.find(x=>x.id===it.id),d);
    persist();
    if(isNew&&UI.cat!=='전체'&&UI.cat!==cat){UI.cat=cat;persistUI()}
    render();closeSheet();toast(isNew?'추가했어요':'저장했어요');
  };
  setTimeout(()=>$('#f-name').focus(),60);
}

function settingsSheet(){
  sheet(`<div class="sheet">
    <h3>설정</h3>
    <label class="f">출산 예정일<input type="date" id="s-due" value="${esc(D.due||'')}"></label>
    <p class="small">넣어 두면 “출산 8M 전” 같은 구매 시기 옆에 실제 연·월이 함께 보여요.</p>
    <h4>백업</h4>
    <div class="stack">
      <button class="btn" type="button" id="s-export">백업 파일 저장</button>
      <label class="btn" style="text-align:center">백업 파일 불러오기<input type="file" id="s-import" accept="application/json,.json" hidden></label>
    </div>
    <p class="small">목록은 이 폰의 브라우저에만 저장돼요. 폰을 바꾸거나 다른 기기로 옮길 때 백업 파일을 저장해서 새 기기에서 불러오세요.</p>
    <h4>초기화</h4>
    <button class="btn del" type="button" id="s-reset">처음 목록으로 되돌리기</button>
    <div id="s-cf"></div>
    <div class="acts"><button class="btn pri" type="button" id="s-close">닫기</button></div>
  </div>`);
  $('#s-due').onchange=e=>{D.due=e.target.value;persist();render()};
  $('#s-close').onclick=closeSheet;
  $('#s-export').onclick=()=>{
    const blob=new Blob([JSON.stringify({app:'babyprep',version:1,savedAt:new Date().toISOString(),...D},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='아기준비물_백업_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('백업 파일을 저장했어요');
  };
  $('#s-import').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const p=JSON.parse(r.result);if(!p||!Array.isArray(p.items))throw 0;
      D={items:p.items.filter(i=>i&&typeof i.name==='string').map(i=>({id:String(i.id||uid()),cat:String(i.cat||'기타'),name:i.name,brand:String(i.brand||''),price:typeof i.price==='number'?i.price:null,priceText:String(i.priceText||''),qty:String(i.qty||''),note:String(i.note||''),when:String(i.when||''),tip:String(i.tip||''),done:!!i.done,order:Number(i.order)||0})),due:typeof p.due==='string'?p.due:''};
      persist();render();closeSheet();toast(`${D.items.length}개 품목을 불러왔어요`)}catch(_){toast('이 앱의 백업 파일이 아니에요. 파일을 다시 확인해 주세요.')}};
    r.readAsText(f);
  };
  $('#s-reset').onclick=()=>{
    $('#s-cf').innerHTML=`<div class="confirm">체크와 직접 고친 내용이 모두 사라져요. 되돌릴까요? <button class="btn del" type="button" id="s-yes">되돌리기</button></div>`;
    $('#s-yes').onclick=()=>{D={items:fromTemplate(),due:D.due};persist();render();closeSheet();toast('처음 목록으로 되돌렸어요')};
  };
}

/* 홈 화면 추가 안내 */
let deferredPrompt=null;
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function showHint(){
  if(standalone||UI.hideHint)return;
  const h=$('#installHint'), ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const msg=deferredPrompt?'홈 화면에 추가하면 앱처럼 바로 열 수 있어요.':ios?'Safari 아래쪽 공유 버튼 → “홈 화면에 추가”를 누르면 앱처럼 쓸 수 있어요.':'브라우저 메뉴(⋮) → “홈 화면에 추가” 또는 “앱 설치”를 누르면 앱처럼 쓸 수 있어요.';
  h.innerHTML=`<p>${msg}</p>${deferredPrompt?'<button class="go" type="button" id="h-install">추가</button>':''}<button type="button" id="h-close" aria-label="안내 닫기">닫기</button>`;
  h.hidden=false;
  $('#h-close').onclick=()=>{UI.hideHint=true;persistUI();h.hidden=true};
  if(deferredPrompt)$('#h-install').onclick=async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;h.hidden=true};
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showHint()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

load();render();showHint();
</script>
